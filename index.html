<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<meta name="description" content="A simple browser music player with a playlist. Add your own audio files; nothing is uploaded.">
<meta name="theme-color" content="#2b50f0">
<meta property="og:title" content="Music Player">
<meta property="og:description" content="A simple browser music player with a playlist. Add your own audio files; nothing is uploaded.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5 9 12l10 7z" fill="currentColor"/><path d="M5 5v14"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7z" fill="currentColor"/><path d="M19 5v14"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></symbol>
</svg>

<h1 class="sr">Music Player</h1>
<main class="app">
  <section class="player" aria-label="Now playing">
    <div class="cover" id="cover"><span id="cover-letter" aria-hidden="true"></span><img id="cover-img" alt="" hidden></div>
    <div class="meta">
      <p class="title" id="title">Nothing playing</p>
      <p class="artist" id="artist">Add some audio files to start</p>
    </div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="btn" id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="btn" id="prev" aria-label="Previous track"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="btn play" id="play" aria-label="Play"><svg class="i"><use id="play-icon" href="#i-play"/></svg></button>
      <button class="btn" id="next" aria-label="Next track"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="btn" id="repeat" aria-label="Repeat: off" data-mode="off"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="volume">
      <button class="btn" id="mute" aria-label="Mute"><svg class="i"><use id="mute-icon" href="#i-vol"/></svg></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" aria-label="Volume">
    </div>
  </section>

  <section class="list" aria-label="Playlist">
    <header>
      <h2>Playlist</h2>
      <div class="actions">
        <button class="btn text" id="add"><svg class="i"><use href="#i-plus"/></svg>Add files</button>
        <button class="btn" id="theme" aria-label="Switch theme"><svg class="i"><use href="#i-theme"/></svg></button>
      </div>
    </header>
    <ul id="tracks"></ul>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="drop" hidden>Drop audio files to add them</div>
<input type="file" id="file" multiple accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.aac,.opus" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
